name: Trigger Automation On PR Merge

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-automation:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.CASTREL_PR_MERGE_WEBHOOK_URL }}
      WEBHOOK_TOKEN: ${{ secrets.CASTREL_PR_MERGE_WEBHOOK_BEARER_TOKEN }}
    steps:
      - name: Validate automation webhook configuration
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error title=Missing secret::Set CASTREL_PR_MERGE_WEBHOOK_URL to your automation ingress URL."
            exit 1
          fi

      - name: Send merged PR event to automation ingress
        run: |
          payload="$(
            jq '{
              event_type: "github.pull_request.merged",
              repository: {
                full_name: .repository.full_name,
                html_url: .repository.html_url,
                default_branch: .repository.default_branch
              },
              pull_request: {
                number: .pull_request.number,
                title: .pull_request.title,
                html_url: .pull_request.html_url,
                base_ref: .pull_request.base.ref,
                head_ref: .pull_request.head.ref,
                merge_commit_sha: .pull_request.merge_commit_sha,
                merged_at: .pull_request.merged_at,
                author: .pull_request.user.login,
                merged_by: .pull_request.merged_by.login,
                labels: [.pull_request.labels[].name]
              },
              sender: .sender.login
            }' "$GITHUB_EVENT_PATH"
          )"

          auth_args=()
          if [ -n "$WEBHOOK_TOKEN" ]; then
            auth_args=(-H "Authorization: Bearer $WEBHOOK_TOKEN")
          fi

          curl --fail --silent --show-error \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request.merged" \
            "${auth_args[@]}" \
            --data "$payload"
